name: Windows preview

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: x86_64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify offline pet creation skill
        run: |
          python -m pip install Pillow==12.3.0
          python -X utf8 scripts/pet-skill.test.py
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Build NSIS preview and COS upload files
        id: preview
        shell: pwsh
        run: |
          $previewConfig = "src-tauri/tauri.preview.conf.json"
          if ($env:TAURI_SIGNING_PRIVATE_KEY) { $previewConfig = "src-tauri/tauri.conf.json" }
          pnpm tauri build --ci --config $previewConfig --target x86_64-pc-windows-msvc --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:TAURI_SIGNING_PRIVATE_KEY -and $env:DESKMATE_UPDATE_MIRROR_BASE_URL) {
            $previewVersion = (Get-Content package.json | ConvertFrom-Json).version
            node scripts/build-update-mirror.mjs src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis output/update-mirror "$env:DESKMATE_UPDATE_MIRROR_BASE_URL" "$previewVersion"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "mirror=true" >> $env:GITHUB_OUTPUT
          }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DESKMATE_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          # Same catalog URL as the release build so the preview installer can
          # refresh the online pet catalog (with the api.github.com fallback).
          DESKMATE_CATALOG_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/catalog/v1/catalog.json
          DESKMATE_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          DESKMATE_UPDATE_MIRROR_BASE_URL: ${{ vars.DESKMATE_UPDATE_MIRROR_BASE_URL }}
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-Windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload COS update files
        if: steps.preview.outputs.mirror == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-Update-Mirror
          path: output/update-mirror/
          if-no-files-found: error
          retention-days: 14
